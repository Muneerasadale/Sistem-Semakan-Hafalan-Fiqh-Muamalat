<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Semakan Hafalan Fiqh Muamalat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985' },
                        mint: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], arabic: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .font-arabic { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        @media print {
            .no-print, header, aside, #matrixFilterBar, #dateModal, #syncModal, #printChoiceModal, button { display: none !important; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .print-container { display: block !important; width: 100% !important; margin: 0 !important; }
            table { border-collapse: collapse !important; width: 100% !important; }
            th, td { border: 1px solid #000 !important; padding: 6px 8px !important; font-size: 11px !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header App -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-brand-600 to-mint-500 rounded-xl text-white shadow-md">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight">Sistem Semakan Hafalan</h1>
                    <p class="text-xs text-brand-600 font-semibold font-arabic">فقه المعاملات - Fiqh Muamalat</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-semibold">
                    <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                    <span id="syncStatusText">Pangkalan Data Berpusat</span>
                </div>

                <!-- BUTANG SIMPAN -->
                <button onclick="saveCurrentData(true)" class="px-3.5 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow transition flex items-center gap-1.5">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Simpan Data</span>
                </button>

                <button onclick="openPrintChoiceModal()" class="px-3.5 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition flex items-center gap-1.5">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    <span>Cetak Laporan</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col md:flex-row gap-6 no-print">
        <!-- Sidebar Senarai Pelajar -->
        <aside class="w-full md:w-80 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 flex flex-col shrink-0">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-1.5">
                <i data-lucide="users" class="w-4 h-4 text-brand-600"></i>
                Senarai Pelajar (7)
            </h2>
            <div id="studentList" class="space-y-1.5 overflow-y-auto max-h-[500px] pr-1 flex-1"></div>
        </aside>

        <!-- Main Content Matrix -->
        <main class="flex-1 flex flex-col gap-5 min-w-0">
            <div id="studentDetailHeader" class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 id="studentNameDisplay" class="text-base sm:text-lg font-bold text-slate-800">--</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Status Kemajuan Hafalan Fiqh Muamalat</p>
                    </div>
                    <div class="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div class="text-right">
                            <div class="text-xs text-slate-500 font-medium">Keseluruhan Hafal</div>
                            <div class="text-xl font-bold text-emerald-600">
                                <span id="studentScoreText">0</span> / <span id="totalRequiredText">38</span>
                            </div>
                        </div>
                        <div class="text-xl font-bold text-slate-700" id="studentPctText">0%</div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
                    <h3 class="font-bold text-slate-800 text-sm">Jadual Hafalan Semasa</h3>
                    <div class="font-arabic font-bold text-brand-700">فقه المعاملات</div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[750px]">
                        <thead>
                            <tr id="matrixTableHeader" class="bg-slate-100/80 border-b border-slate-200 text-slate-700 text-xs uppercase">
                                <th class="p-3 pl-4 font-bold min-w-[150px]">Bab / Topik</th>
                            </tr>
                        </thead>
                        <tbody id="matrixTableBody" class="divide-y divide-slate-100 text-xs"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL PILIHAN CETAKAN -->
    <div id="printChoiceModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-md w-full p-6 space-y-5">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i data-lucide="printer" class="w-5 h-5 text-emerald-600"></i>
                    Pilih Format Cetakan Laporan
                </h3>
                <button onclick="closePrintModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-3">
                <button onclick="printIndividualReport()" class="w-full p-4 text-left rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition flex items-start gap-3">
                    <div class="p-2.5 bg-brand-100 text-brand-700 rounded-lg"><i data-lucide="user-check" class="w-5 h-5"></i></div>
                    <div>
                        <div class="text-sm font-bold text-slate-800">PILIHAN A: Laporan Individu Pelajar</div>
                        <div class="text-xs text-slate-500 mt-0.5">Mencetak helaian laporan lengkap untuk pelajar yang dipilih.</div>
                    </div>
                </button>
                <button onclick="printClassOverviewReport()" class="w-full p-4 text-left rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/50 transition flex items-start gap-3">
                    <div class="p-2.5 bg-emerald-100 text-emerald-700 rounded-lg"><i data-lucide="users" class="w-5 h-5"></i></div>
                    <div>
                        <div class="text-sm font-bold text-slate-800">PILIHAN B: Ringkasan Keseluruhan Kelas</div>
                        <div class="text-xs text-slate-500 mt-0.5">Mencetak jadual ringkasan hafalan semua pelajar.</div>
                    </div>
                </button>
            </div>
            <div class="flex justify-end pt-2 border-t border-slate-100">
                <button onclick="closePrintModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
            </div>
        </div>
    </div>

    <div id="printSection" class="hidden print-container"></div>

    <!-- Date Picker Modal -->
    <div id="dateModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-sm w-full p-5 space-y-4">
            <h3 class="font-bold text-slate-800 text-sm">Tandakan Tarikh Hafalan</h3>
            <input type="date" id="modalDatePicker" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
            <div class="flex justify-end gap-2">
                <button onclick="closeDateModal()" class="px-3 py-1.5 text-xs text-slate-600">Batal</button>
                <button onclick="saveDateSelection()" class="px-4 py-1.5 text-xs bg-brand-600 text-white font-semibold rounded-lg">Simpan Tarikh</button>
            </div>
        </div>
    </div>

    <!-- LOGIK JAVASCRIPT UNTUK CROSS-DEVICE REALTIME STORAGE -->
    <script>
        // ENDPOINT KEY UNTUK AWAN BERPUSAT (KHAS UNTUK SK MUNEERASADALE)
        const CLOUD_SYNC_ENDPOINT = "https://api.myjson.online/v1/records/4f5f8a00-fiqh-muamalat-hafalan";

        const CURRICULUM = {
            titleArabic: "فقه المعاملات", titleMalay: "Fiqh Muamalat",
            columns: [
                { id: "takrif", nameMalay: "Takrif (Definisi)", nameArabic: "تعريف" },
                { id: "dalil", nameMalay: "Dalil", nameArabic: "دليل" },
                { id: "ahkam", nameMalay: "Ahkam (Hukum)", nameArabic: "أحكام" },
                { id: "anwa", nameMalay: "Anwa' (Jenis)", nameArabic: "أنواع" },
                { id: "arkan", nameMalay: "Arkan (Rukun)", nameArabic: "أركان" },
                { id: "shurut", nameMalay: "Shurut (Syarat)", nameArabic: "شروط" }
            ],
            chapters: [
                { id: "al_bai", nameMalay: "Al-Bai' (Jual Beli)", nameArabic: "البيع", requirements: { takrif: true, dalil: true, ahkam: false, anwa: true, arkan: true, shurut: true } },
                { id: "al_riba", nameMalay: "Al-Riba", nameArabic: "الربا", requirements: { takrif: true, dalil: true, ahkam: true, anwa: true, arkan: false, shurut: true } },
                { id: "al_khiyar", nameMalay: "Al-Khiyar", nameArabic: "الخيار", requirements: { takrif: false, dalil: false, ahkam: false, anwa: true, arkan: false, shurut: false } },
                { id: "al_salam", nameMalay: "Al-Salam", nameArabic: "السلم", requirements: { takrif: true, dalil: true, ahkam: false, anwa: false, arkan: true, shurut: true } },
                { id: "al_rahn", nameMalay: "Al-Rahn (Gadai)", nameArabic: "الرهن", requirements: { takrif: true, dalil: true, ahkam: true, anwa: false, arkan: true, shurut: true } },
                { id: "al_dhaman", nameMalay: "Al-Dhaman (Jaminan)", nameArabic: "الضمان", requirements: { takrif: true, dalil: true, ahkam: true, anwa: false, arkan: true, shurut: true } },
                { id: "al_wakalah", nameMalay: "Al-Wakalah (Wakil)", nameArabic: "الوكالة", requirements: { takrif: true, dalil: true, ahkam: true, anwa: false, arkan: true, shurut: true } },
                { id: "al_qiradh", nameMalay: "Al-Qiradh (Pelaburan)", nameArabic: "القراض", requirements: { takrif: true, dalil: true, ahkam: true, anwa: false, arkan: true, shurut: true } }
            ]
        };

        const INITIAL_STUDENTS = [
            { id: "std_1", name: "AREEFA DALILA BINTI SHARUL AZLAN" },
            { id: "std_2", name: "FAIROZ SYAHMI BIN MOHD ZAIDI" },
            { id: "std_3", name: "MUIZ ZAMAN BIN MOHAMAD ZAKI" },
            { id: "std_4", name: "NOR QAMIELIEYA BINTI AMRAN" },
            { id: "std_5", name: "NUR AUNI SYAZWINA BINTI MOHD AZRIL" },
            { id: "std_6", name: "NUR IZZATI UMAIRA BINTI ABDULLAH" },
            { id: "std_7", name: "QAMIEYL IYQRAM ASZRIN BIN ABDULLAH" }
        ];

        let totalMandatoryItems = 0;
        CURRICULUM.chapters.forEach(ch => {
            Object.keys(ch.requirements).forEach(colId => { if (ch.requirements[colId]) totalMandatoryItems++; });
        });

        let currentStudentId = "std_1";
        let activeTargetCell = null;
        window.memorizationData = {};

        document.addEventListener('DOMContentLoaded', () => {
            renderHeaderColumns();
            fetchCloudData();
            // Semak data baharu dari awan setiap 8 saat secara latar belakang
            setInterval(fetchCloudData, 8000);
            if (window.lucide) window.lucide.createIcons();
        });

        // FUNGSI TARIK DATA DARIPADA AWAN
        async function fetchCloudData() {
            try {
                const res = await fetch("https://api.keyvalue.xyz/2d8f9a1c/fiqh_muamalat_hafalan_muneera");
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.trim().length > 0 && text !== "null") {
                        const cloudData = JSON.parse(text);
                        window.memorizationData = cloudData;
                        localStorage.setItem('fiqh_muamalat_hafalan_data', JSON.stringify(cloudData));
                        renderAllViews();
                        updateSyncUI(true, "Awan Terhubung (Pangkalan Data Berpusat)");
                        return;
                    }
                }
            } catch (e) {
                console.warn("Memuatkan data tempatan...");
            }
            window.memorizationData = JSON.parse(localStorage.getItem('fiqh_muamalat_hafalan_data')) || {};
            renderAllViews();
        }

        // FUNGSI HANTAR DATA KE AWAN BILA TEKAN SIMPAN
        async function saveCurrentData(showAlert = false) {
            localStorage.setItem('fiqh_muamalat_hafalan_data', JSON.stringify(window.memorizationData));
            updateSyncUI(false, "Menyimpan...");

            try {
                const res = await fetch("https://api.keyvalue.xyz/2d8f9a1c/fiqh_muamalat_hafalan_muneera", {
                    method: "POST",
                    body: JSON.stringify(window.memorizationData)
                });

                if (res.ok) {
                    updateSyncUI(true, "Diselaraskan Ke Awan");
                    if (showAlert) {
                        alert("BERJAYA! Data hafalan telah tersimpan ke Awan Berpusat. Semua murid kini akan dapat melihat data terbaharu ini.");
                    }
                } else {
                    throw new Error("Gagal simpan");
                }
            } catch (e) {
                updateSyncUI(false, "Disimpan Tempatan sahaja");
                if (showAlert) {
                    alert("Tersimpan dalam peranti sahaja. Sila pastikan anda mempunyai sambungan internet untuk menyelaras ke awan.");
                }
            }
        }

        function updateSyncUI(statusOK, text) {
            const dot = document.getElementById('syncDot');
            const txt = document.getElementById('syncStatusText');
            if (dot) dot.className = statusOK ? "w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse" : "w-2.5 h-2.5 rounded-full bg-amber-500 inline-block";
            if (txt) txt.innerText = text;
        }

        function renderHeaderColumns() {
            const headerTr = document.getElementById('matrixTableHeader');
            if (!headerTr) return;
            let html = '<th class="p-3 pl-4 font-bold min-w-[150px]">Bab / Topik</th>';
            CURRICULUM.columns.forEach(col => {
                html += `<th class="p-3 text-center border-l border-slate-200 min-w-[100px] whitespace-nowrap">${col.nameMalay}</th>`;
            });
            headerTr.innerHTML = html;
        }

        function renderAllViews() {
            renderStudentList();
            renderStudentMatrix();
        }

        function getStudentStats(stdId) {
            const records = window.memorizationData[stdId] || {};
            let count = 0;
            CURRICULUM.chapters.forEach(ch => {
                Object.keys(ch.requirements).forEach(colId => {
                    if (ch.requirements[colId] && records[`${ch.id}_${colId}`]) count++;
                });
            });
            const pct = Math.round((count / totalMandatoryItems) * 100);
            return { count, pct };
        }

        function renderStudentList() {
            const container = document.getElementById('studentList');
            if (!container) return;
            container.innerHTML = "";
            INITIAL_STUDENTS.forEach(std => {
                const { count, pct } = getStudentStats(std.id);
                const isSelected = std.id === currentStudentId;
                const item = document.createElement('div');
                item.onclick = () => { currentStudentId = std.id; renderAllViews(); };
                item.className = `p-2.5 rounded-xl border transition cursor-pointer flex items-center justify-between ${
                    isSelected ? 'bg-brand-50 border-brand-300 font-semibold' : 'bg-white hover:bg-slate-50 border-slate-200'
                }`;
                item.innerHTML = `
                    <div class="text-xs text-slate-800 truncate">${std.name}</div>
                    <span class="text-xs font-bold ${pct === 100 ? 'text-emerald-600' : 'text-slate-600'}">${pct}%</span>
                `;
                container.appendChild(item);
            });
        }

        function renderStudentMatrix() {
            const std = INITIAL_STUDENTS.find(s => s.id === currentStudentId) || INITIAL_STUDENTS[0];
            document.getElementById('studentNameDisplay').innerText = std.name;
            const { count, pct } = getStudentStats(std.id);
            document.getElementById('studentScoreText').innerText = count;
            document.getElementById('studentPctText').innerText = `${pct}%`;

            const tbody = document.getElementById('matrixTableBody');
            if (!tbody) return;
            tbody.innerHTML = "";
            const records = window.memorizationData[std.id] || {};

            CURRICULUM.chapters.forEach((ch, idx) => {
                const tr = document.createElement('tr');
                tr.className = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50';

                let rowHtml = `
                    <td class="p-3 pl-4 font-semibold text-slate-800 whitespace-nowrap">
                        <div>${ch.nameMalay}</div>
                        <div class="font-arabic text-
